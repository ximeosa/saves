<!DOCTYPE html>
<html>
<head>
  <title>Advanced Bookmarker - Options</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
    }
    .container {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 20px;
      color: #555;
      margin-top: 30px;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }
    .bookmark-list {
      list-style-type: none;
      padding: 0;
    }
    /* ... existing body, container, h1, section-title, bookmark-list ... */
    .bookmark-item {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 4px;
      display: flex; /* Keep flex */
      align-items: flex-start; /* Align items to the top */
      gap: 10px; /* Add some space between image and text */
    }
    .bookmark-item:hover {
      background-color: #f1f1f1;
    }
    .bookmark-image {
      object-fit: cover; /* Crop image nicely */
      border-radius: 3px;
      flex-shrink: 0; /* Prevent image from shrinking */
    }
    .bookmark-favicon {
      width: 32px; /* Standard favicon size */
      height: 32px;
      border: 1px solid #eee;
    }
    .bookmark-thumbnail {
      width: 100px; /* Larger for thumbnails */
      height: auto; /* Maintain aspect ratio, or set fixed height e.g. 60px */
      max-height: 75px;
      border: 1px solid #eee;
    }
    .bookmark-info {
      flex-grow: 1; /* Allow text content to take remaining space */
      display: flex;
      flex-direction: column;
    }
    .bookmark-title {
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 3px;
    }
    .bookmark-url {
      font-size: 0.9em;
      color: #007bff;
      text-decoration: none;
      word-break: break-all; /* Prevent long URLs from breaking layout */
      margin-bottom: 3px;
    }
    .bookmark-url:hover {
      text-decoration: underline;
    }
    .bookmark-selection-text {
        font-size: 0.9em;
        color: #333;
        background-color: #e9e9e9;
        padding: 4px;
        border-radius: 3px;
        margin-top: 4px;
        margin-bottom: 4px;
    }
    .bookmark-date {
        font-size: 0.8em;
        color: #777;
        margin-top: auto; /* Pushes date to bottom if info is flex column */
    }
    .bookmark-actions {
      margin-left: auto; /* Push actions to the far right */
      padding-left: 10px; /* Space from text */
      flex-shrink: 0; /* Prevent actions from shrinking */
    }
    .bookmark-actions button {
      cursor: pointer;
      padding: 5px 8px;
      font-size: 0.9em;
      border: 1px solid #ccc;
      border-radius: 3px;
      background-color: #e7e7e7;
    }
    .bookmark-actions button:hover {
      background-color: #ddd;
    }
    /* D&D Styles */
    .dnd-enabled .bookmark-item {
      cursor: move; /* Indicate draggable */
    }
    .bookmark-item.dragging {
      opacity: 0.5;
      border: 1px dashed #007bff;
    }
    .bookmark-item.drag-over {
      background-color: #e0eafc; /* Highlight drop target */
      border: 1px dashed #007bff;
    }
    /* ... existing controls styles ... */
    .controls button, .controls input[type="file"], .controls .setting-toggle {
      padding: 8px 15px;
      margin-right: 10px;
      margin-bottom: 10px; /* Add margin bottom for better spacing if they wrap */
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #e7e7e7;
      display: inline-flex; /* Align items nicely */
      align-items: center;
    }
    .controls button:hover, .controls input[type="file"]:hover, .controls .setting-toggle:hover {
      background-color: #ddd;
    }
    .setting-toggle {
      border: none; /* Remove border from the div container */
      background-color: transparent; /* Make container transparent */
      padding: 0; /* Reset padding */
    }
    .setting-toggle label {
      margin-right: 8px;
      cursor: pointer;
    }
    .setting-toggle input[type="checkbox"] {
      width: 18px; /* Adjust size as needed */
      height: 18px;
      cursor: pointer;
    }
    .controls {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    .controls button, .controls input[type="file"] {
      padding: 8px 15px;
      margin-right: 10px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #e7e7e7;
    }
    .controls button:hover, .controls input[type="file"]:hover {
      background-color: #ddd;
    }
    #importFileLabel {
        margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Bookmarks</h1>

    <div class="controls">
      <button id="exportBtn">Export Bookmarks</button>
      <label for="importFile" id="importFileLabel">Import Bookmarks:</label>
      <input type="file" id="importFile" accept=".json">
      <span id="importStatus"></span>
      
      <div class="setting-toggle">
        <label for="dragDropToggle">Enable Drag & Drop Reordering:</label>
        <input type="checkbox" id="dragDropToggle">
      </div>
    </div>

    <h2 class="section-title">Websites & Pages</h2>
    <ul id="websitesList" class="bookmark-list">
      <!-- Bookmarks will be dynamically inserted here -->
      <li class="bookmark-item">Placeholder for a website bookmark.</li>
    </ul>

    <h2 class="section-title">YouTube Content</h2>
    <ul id="youtubeList" class="bookmark-list">
      <!-- YouTube bookmarks will be dynamically inserted here -->
      <li class="bookmark-item">Placeholder for a YouTube video/channel.</li>
    </ul>
    
    <h2 class="section-title">Selections & Notes</h2>
    <ul id="selectionsList" class="bookmark-list">
      <!-- Selection bookmarks will be dynamically inserted here -->
      <li class="bookmark-item">Placeholder for a text selection.</li>
    </ul>

  </div>
  <script src="options.js"></script>
</body>
</html>
